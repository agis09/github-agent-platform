[project]
name = "agent-platform"
version = "0.1.0"
description = "GitHub App that plans, implements (after human approval) and reviews issue fixes with a pluggable coding agent in Kubernetes sandboxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "pydantic>=2.8,<3",
    "pyjwt>=2.14.0",
]

[project.scripts]
agentctl = "agent_platform.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S104: the bind-address test passes 0.0.0.0 to prove the k8s-placed
# receiver's non-loopback bind (monkeypatched server, no real socket).
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
