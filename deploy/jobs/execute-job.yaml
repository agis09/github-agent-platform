# Execute Job: one-shot sandbox that applies an APPROVED plan inside a
# repository snapshot pinned at the approval's base SHA, runs the approved
# test commands, and prints the ExecutionResult + patch between log markers
# (agent_platform.worker.execute).
#
# Differences from the Plan Job:
#   - the agent runs in write mode over /workspace/repo (the Pod boundary
#     is the sandbox)
#   - the repository snapshot is unpacked by an init container (base SHA
#     fixed)
#   - the egress level / search labels select the NetworkPolicies that the
#     terraform module renders for this deployment
#   - git push is impossible: no credentials anywhere in the Pod
#
# Template placeholders ({{...}}) are filled by KubeJobLauncher. A line
# holding only an empty optional placeholder is removed.
apiVersion: batch/v1
kind: Job
metadata:
  name: execute-{{TASK_ID}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/part-of: agent-platform
    agent-platform.role: execute
spec:
  activeDeadlineSeconds: {{ACTIVE_DEADLINE_SECONDS}}
  ttlSecondsAfterFinished: {{TTL_SECONDS}}
  backoffLimit: 0
  completionMode: NonIndexed
  suspend: false
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-platform
        agent-platform.role: execute
        agent-platform.task: execute-{{TASK_ID}}
        # The NetworkPolicies terraform renders select on these. The
        # orchestrator sets them; the worker has no SA token to change them.
        agent-platform.egress: "{{EGRESS_LEVEL}}"
        agent-platform.search: "{{SEARCH_PROVIDER}}"
    spec:
      initContainers:
        {{EXTRA_INIT_CONTAINERS}}
      restartPolicy: Never
      serviceAccountName: worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{WORKER_IMAGE}}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "agent_platform.worker.execute"]
          env:
            - name: EXEC_TASK_ID
              value: "{{TASK_ID}}"
            - name: EXEC_PLAN_HASH
              value: "{{PLAN_HASH}}"
            - name: EXEC_BASE_BRANCH
              value: "{{BASE_BRANCH}}"
            - name: EXEC_BASE_SHA
              value: "{{BASE_SHA}}"
            - name: EXEC_ALLOWED_PATHS
              value: "{{ALLOWED_PATHS}}"
            - name: EXEC_TEST_COMMANDS
              value: "{{TEST_COMMANDS}}"
            # Forbidden search vocabulary (JSON list) derived at plan time
            # from the untrusted task context; enforced by the search CLI's
            # sanitizer inside the worker and again by the Search Gateway.
            - name: EXEC_SEARCH_FORBIDDEN
              value: "{{SEARCH_FORBIDDEN}}"
            # Search CLI provider (gateway | none) and the in-cluster
            # Search Gateway URL (empty when search is disabled).
            - name: SEARCH_PROVIDER
              value: "{{SEARCH_PROVIDER}}"
            - name: SEARCH_GATEWAY_URL
              value: "{{SEARCH_GATEWAY_URL}}"
            # Egress level allowlist only: proxy env vars pointing at the
            # egress proxy (the line is removed for none/full).
            {{EGRESS_PROXY_ENV}}
            - name: EXEC_COMMAND_TIMEOUT
              value: "{{COMMAND_TIMEOUT}}"
            - name: EXEC_MAX_OUTPUT
              value: "{{MAX_OUTPUT}}"
            - name: EXEC_PROMPT
              value: "{{PROMPT}}"
            - name: EXEC_S3_RESULT_URL
              value: "{{S3_PUT_RESULT_URL}}"
            - name: EXEC_S3_PATCH_URL
              value: "{{S3_PUT_PATCH_URL}}"
            {{AGENT_ENV}}
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
              ephemeral-storage: "2Gi"
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            - name: out
              mountPath: /out
            - name: home
              mountPath: /home/worker
            - name: workspace
              mountPath: /workspace
            {{EXTRA_VOLUME_MOUNTS}}
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
        - name: out
          emptyDir:
            sizeLimit: 16Mi
        - name: home
          emptyDir:
            sizeLimit: 256Mi
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
        {{EXTRA_VOLUMES}}
