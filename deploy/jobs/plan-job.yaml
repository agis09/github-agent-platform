# Plan Job: one-shot READ-ONLY sandbox that runs a single plan and prints
# the PlanResult between log markers (agent_platform.worker.plan).
#
# Security posture (docs/design.md "Sandbox"):
#   - Pod Security Standards restricted (namespace-level enforce + explicit
#     securityContext on the pod and container)
#   - non-root uid 10001, read-only root filesystem, all caps dropped,
#     seccomp RuntimeDefault, no privilege escalation, no SA token
#   - CPU/memory/ephemeral-storage limits, activeDeadlineSeconds, TTL cleanup
#   - no GitHub credentials anywhere in the spec; the only secret is the
#     LLM API key
#
# Template placeholders ({{...}}) are filled by KubeJobLauncher
# (src/agent_platform/adapters/kubernetes/kube.py) at launch time; the file
# stays hand-readable and reviewable without a templating dependency.
apiVersion: batch/v1
kind: Job
metadata:
  name: plan-{{TASK_ID}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/part-of: agent-platform
    agent-platform.role: plan
spec:
  # Hard deadline: a hung plan must die here (exceeds the agent timeout).
  activeDeadlineSeconds: {{ACTIVE_DEADLINE_SECONDS}}
  ttlSecondsAfterFinished: {{TTL_SECONDS}}
  backoffLimit: 0
  completionMode: NonIndexed
  suspend: false
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-platform
        agent-platform.role: plan
        agent-platform.task: plan-{{TASK_ID}}
    spec:
      restartPolicy: Never
      serviceAccountName: worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{WORKER_IMAGE}}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "agent_platform.worker.plan"]
          env:
            - name: PLAN_TASK_ID
              value: "{{TASK_ID}}"
            - name: PLAN_REPOSITORY
              value: "{{REPOSITORY}}"
            - name: PLAN_ISSUE_NUMBER
              value: "{{ISSUE_NUMBER}}"
            - name: PLAN_BASE_BRANCH
              value: "{{BASE_BRANCH}}"
            - name: PLAN_BASE_SHA
              value: "{{BASE_SHA}}"
            - name: PLAN_ISSUE_TITLE
              value: "{{ISSUE_TITLE}}"
            - name: PLAN_ISSUE_BODY
              value: "{{ISSUE_BODY}}"
            {{AGENT_ENV}}
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
              ephemeral-storage: "2Gi"
          volumeMounts:
            # writable scratch for the agent CLI state (read-only rootfs)
            - name: scratch
              mountPath: /tmp
            - name: out
              mountPath: /out
            - name: home
              mountPath: /home/worker
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
        - name: out
          emptyDir:
            sizeLimit: 16Mi
        - name: home
          emptyDir:
            sizeLimit: 256Mi
